{% extends "base.html" %}
{% block page %}admin-login{% endblock %}
{% block title %}Admin sign in | AI MANGA INDIA{% endblock %}
{% block content %}
<meta name="robots" content="noindex,nofollow">
<section class="sec"><div class="wrap" style="max-width:440px">
  <h1 style="font-size:2rem">Admin sign in</h1><p>Administrator accounts only.</p>
  <form class="panel card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ request.values.get('next','') }}">
    <div class="field"><label for="ae">Email address</label><input id="ae" name="email" type="email" required autocomplete="username"></div>
    <div class="field"><label for="ap">Password</label><input id="ap" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</div></section>
{% endblock %}
